# 中心库迁移配置（Alembic）
# 用法（在 backend/ 目录）：
#   alembic -c alembic/center.ini upgrade head          # 在线执行（发布任务）
#   alembic -c alembic/center.ini upgrade head --sql    # 仅输出 SQL（离线校验）
# 中心库只由独立发布任务执行迁移，API 启动时不自动迁移。
[alembic]
script_location = %(here)s/center
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url = mysql+pymysql://ventasync:ventasync@127.0.0.1:3306/ventasync_center?charset=utf8mb4
