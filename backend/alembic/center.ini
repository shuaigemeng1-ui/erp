# Center database migrations (Alembic).
# Usage (run from backend/):
#   alembic -c alembic/center.ini upgrade head          # online (release job)
#   alembic -c alembic/center.ini upgrade head --sql    # offline SQL (verification)
# The center database is migrated by a dedicated release task; the API never
# runs migrations on startup.
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale,
# which is GBK on Chinese Windows and cannot decode Chinese characters.
[alembic]
script_location = %(here)s/center
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url = mysql+pymysql://ventasync:ventasync@127.0.0.1:3306/ventasync_center?charset=utf8mb4
