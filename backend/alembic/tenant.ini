# 租户库迁移配置（Alembic）
# 每个租户库独立执行，版本表也独立；由开通任务或发布任务按租户调用：
#   alembic -c alembic/tenant.ini -x db_url=mysql+pymysql://... upgrade head
# 也可通过环境变量 TENANT_DATABASE_URL 指定目标库。
[alembic]
script_location = %(here)s/tenant
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url =
