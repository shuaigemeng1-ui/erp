# Tenant database migrations (Alembic). One migration run per tenant database.
# Usage (run from backend/):
#   alembic -c alembic/tenant.ini -x db_url=mysql+pymysql://user:pass@host:3306/vs_tenant_1 upgrade head
#   alembic -c alembic/tenant.ini -x db_url=... upgrade head --sql   # offline SQL
# TENANT_DATABASE_URL environment variable can be used instead of -x db_url.
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale,
# which is GBK on Chinese Windows and cannot decode Chinese characters.
[alembic]
script_location = %(here)s/tenant
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url =
