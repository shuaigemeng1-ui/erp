name: erp-gateway

services:
  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    image: erp-gateway:${GATEWAY_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GATEWAY_DB_PATH: /data/gateway.db
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - gateway_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gateway_data:
    name: erp_gateway_data
