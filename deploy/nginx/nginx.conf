# =============================================================================
# VentaSync Nginx 站点配置（挂载到 /etc/nginx/nginx.conf）
#
# 职责：
#   * /api/ 反向代理到 api:8000（保留 /api/v1 前缀，Cookie 会话同源）
#   * 托管 frontend 构建产物（frontend/Dockerfile 的 nginx 阶段，/usr/share/nginx/html）
#   * gzip 压缩、安全响应头、HTTP/1.1 长连接与 Upgrade 透传
#   * SPA 路由回退（history 模式）
#
# 注意：
#   * 本文件覆盖镜像自带配置，frontend/Dockerfile 已删除默认站点，避免重复监听 80。
#   * 首版 HTTP 部署；启用 HTTPS 时在下方 server 增加 443 + 证书挂载，
#     并把 deploy/.env 的 APP_ORIGIN / CORS_ALLOW_ORIGINS 改为 https 地址、
#     SESSION_COOKIE_SECURE=true，再打开 HSTS（见文件末尾注释）。
# =============================================================================

user  nginx;
worker_processes  auto;
pid   /var/run/nginx.pid;

error_log  /var/log/nginx/error.log  warn;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 访问日志附加 request_id / 上游耗时，便于与后端日志、错误响应中的 request_id 对齐
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rid=$http_x_request_id rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    server_tokens       off;
    client_max_body_size 20m;
    client_body_timeout  30s;

    # ---------------------------------------------------------------- gzip
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/manifest+json
        image/svg+xml;

    # Upgrade 透传：普通请求 Connection 为空（保持 upstream 长连接），
    # WebSocket 等升级请求转发 Upgrade 头。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # API 上游使用 Docker 内置 DNS 动态解析：
    # 避免 api 容器重建/IP 变化后 nginx 仍缓存旧地址导致 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen       80 default_server;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ------------------------------------------------------------ 安全响应头
        # 说明：add_header 在 location 中重新声明会覆盖 server 级继承，
        # 因此除 /healthz 外各 location 不再声明 add_header（用 expires 控制缓存）。
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Vue 3 构建产物为外链脚本；Element Plus 使用内联样式，故 style-src 放开 unsafe-inline
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        # ------------------------------------------------------------ 健康检查
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ------------------------------------------------------------ API 反向代理
        location /api/ {
            set $api_upstream api:8000;
            proxy_pass          http://$api_upstream;
            proxy_http_version  1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            # 由 Nginx 生成请求标识，后端统一回写 x-request-id 并在错误响应中返回
            proxy_set_header X-Request-ID      $request_id;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # 上传接口（图片等）由后端读取请求体，限制已在 server 级设置；
            # 其余 JSON 响应保持默认缓冲，避免大列表占用连接。
        }

        # ------------------------------------------------------------ 平台回调
        # 回调走同一 /api/ 前缀（/api/v1/integrations/shopee/...），不额外放行。
        # 若回调域名单独部署，可在此增加 server 块，但必须保留签名校验逻辑在后端。

        # ------------------------------------------------------------ 静态资源
        # Vite 产物文件名带内容哈希，可长缓存；使用 expires 避免覆盖 server 级安全响应头
        location /assets/ {
            access_log off;
            expires    1y;
            try_files  $uri =404;
        }

        location = /index.html {
            expires    -1;
            try_files  $uri =404;
        }

        # SPA history 路由回退
        location / {
            expires   -1;
            try_files $uri $uri/ /index.html;
        }

        # 拒绝隐藏文件（.git、.env 等不应出现在静态目录）
        location ~ /\. {
            deny all;
        }
    }
}

