# 备份目录与加密密钥目录权限（批次3）
# 安装：install -m 644 deploy/systemd/ventasync-backups.tmpfiles.conf /etc/tmpfiles.d/
# 应用：systemd-tmpfiles --create /etc/tmpfiles.d/ventasync-backups.conf
# 说明：
#   * Agent 执行用户 erp-agent-exec 属于共享组 erp-agent，升级前备份以该用户运行；
#   * 目录 2770 root:erp-agent（setgid 让子目录继承属组），密钥 640 root:erp-agent；
#   * 文件由备份脚本创建为 600（仅属主），符合「目录 700 / 文件 600」的备份产物要求。
d /var/lib/ventasync-backups 2770 root erp-agent -
d /var/lib/ventasync-backups/releases 2770 root erp-agent -
d /var/lib/ventasync-backups/offsite 2770 root erp-agent -
d /var/lib/ventasync-backups/drill-reports 2770 root erp-agent -
d /etc/ventasync 2770 root erp-agent -
